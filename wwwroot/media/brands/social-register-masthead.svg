<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="The Social Register Masthead">
  <defs>
    <linearGradient id="srGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CFA0"/>
      <stop offset="50%" stop-color="#C6AE73"/>
      <stop offset="100%" stop-color="#9F864B"/>
    </linearGradient>
    <linearGradient id="srThistle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD8E0"/>
      <stop offset="55%" stop-color="#D8C0CB"/>
      <stop offset="100%" stop-color="#A88296"/>
    </linearGradient>
  </defs>
  <!-- Celestial Crown Arc & 8-Point Star -->
  <path d="M 380 82 A 115 62 0 0 1 580 82" fill="none" stroke="url(#srGold)" stroke-width="1.6"/>
  <polygon points="480,14 484,38 508,42 484,46 480,70 476,46 452,42 476,38" fill="url(#srGold)"/>
  <polygon points="480,26 482,40 496,42 482,44 480,58 478,44 464,42 478,40" fill="#FFFFFF" opacity="0.55"/>
  <polygon points="418,52 420,58 426,60 420,62 418,68 416,62 410,60 416,58" fill="url(#srGold)"/>
  <polygon points="542,52 544,58 550,60 544,62 542,68 540,62 534,60 540,58" fill="url(#srGold)"/>

  <!-- Symmetrical Botanical Lily & Thistle Sprigs -->
  <g stroke="url(#srGold)" stroke-width="1.5" fill="none">
    <path d="M 412 96 C 365 92, 320 62, 260 76 C 228 84, 206 96, 182 82"/>
    <path d="M 548 96 C 595 92, 640 62, 700 76 C 732 84, 754 96, 778 82"/>
    <path d="M 345 78 C 334 60, 316 52, 298 56 C 314 68, 326 76, 345 78 Z" fill="url(#srGold)" opacity="0.85"/>
    <path d="M 615 78 C 626 60, 644 52, 662 56 C 646 68, 634 76, 615 78 Z" fill="url(#srGold)" opacity="0.85"/>
  </g>
  <!-- Left & Right Lily Blossoms (Thistle) -->
  <g fill="url(#srThistle)" stroke="url(#srGold)" stroke-width="1.1">
    <path d="M 286 72 C 272 42, 242 36, 232 52 C 248 58, 264 68, 286 72 Z"/>
    <path d="M 286 72 C 260 56, 232 66, 236 84 C 254 84, 270 80, 286 72 Z"/>
    <path d="M 286 72 C 274 88, 254 102, 240 98 C 250 86, 268 76, 286 72 Z"/>
    <path d="M 674 72 C 688 42, 718 36, 728 52 C 712 58, 696 68, 674 72 Z"/>
    <path d="M 674 72 C 700 56, 728 66, 724 84 C 706 84, 690 80, 674 72 Z"/>
    <path d="M 674 72 C 686 88, 706 102, 720 98 C 710 86, 692 76, 674 72 Z"/>
  </g>

  <!-- Masthead Lettering -->
  <text x="480" y="102" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="28" letter-spacing="11" fill="#48293D">THE</text>
  <text x="480" y="192" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="92" letter-spacing="4" fill="#48293D">SOCIAL REGISTER</text>

  <!-- Lower Ornamental Flourish -->
  <line x1="170" y1="232" x2="386" y2="232" stroke="url(#srGold)" stroke-width="1.8"/>
  <line x1="574" y1="232" x2="790" y2="232" stroke="url(#srGold)" stroke-width="1.8"/>
  <polygon points="402,226 406,232 402,238 398,232" fill="url(#srGold)"/>
  <polygon points="558,226 562,232 558,238 554,232" fill="url(#srGold)"/>
  <path d="M 424 232 C 446 214, 468 218, 480 232 C 492 218, 514 214, 536 232 C 514 248, 492 244, 480 258 C 468 244, 446 248, 424 232 Z" fill="none" stroke="url(#srGold)" stroke-width="1.8"/>
</svg>
