<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="The Social Register SR Monogram">
  <defs>
    <linearGradient id="srMonoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6D5AA"/>
      <stop offset="50%" stop-color="#C6AE73"/>
      <stop offset="100%" stop-color="#9A7E42"/>
    </linearGradient>
    <linearGradient id="srMonoRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7E1"/>
      <stop offset="100%" stop-color="#B78EA3"/>
    </linearGradient>
  </defs>
  <!-- Outer Botanical & Celestial Crest -->
  <circle cx="160" cy="164" r="120" fill="none" stroke="url(#srMonoGold)" stroke-width="1.4" stroke-dasharray="220 36"/>
  <circle cx="160" cy="164" r="112" fill="none" stroke="url(#srMonoGold)" stroke-width="0.8" opacity="0.65"/>
  <!-- Top 8-point Star -->
  <polygon points="160,18 164,36 182,40 164,44 160,62 156,44 138,40 156,36" fill="url(#srMonoGold)"/>
  <!-- Thistle/Lily Accents -->
  <path d="M 64 218 C 44 196, 48 166, 68 158 C 66 182, 74 200, 90 214 Z" fill="url(#srMonoRose)" stroke="url(#srMonoGold)" stroke-width="1.1"/>
  <path d="M 256 112 C 276 90, 272 62, 252 54 C 254 78, 246 96, 230 110 Z" fill="url(#srMonoRose)" stroke="url(#srMonoGold)" stroke-width="1.1"/>
  <!-- Intertwined SR Letterforms -->
  <text x="128" y="210" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="146" fill="url(#srMonoGold)">S</text>
  <text x="188" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="136" fill="url(#srMonoRose)" opacity="0.92">R</text>
  <text x="186" y="224" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="136" fill="none" stroke="url(#srMonoGold)" stroke-width="1.5">R</text>
  <!-- Bottom Finial -->
  <polygon points="160,276 164,286 174,290 164,294 160,304 156,294 146,290 156,286" fill="url(#srMonoGold)"/>
</svg>
