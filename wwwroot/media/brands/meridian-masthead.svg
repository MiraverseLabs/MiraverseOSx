<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-label="The Meridian Masthead — Abstract Celestial Meridian Emblem">
  <defs>
    <linearGradient id="merSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#506F8A"/>
      <stop offset="100%" stop-color="#464C55"/>
    </linearGradient>
    <linearGradient id="merGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC892"/>
      <stop offset="100%" stop-color="#C6AE73"/>
    </linearGradient>
  </defs>

  <!-- Abstract Celestial Armillary Meridian Dome (Zero Earth Geography; Eight Meridian Arcs + Radiance & Echo Twin Moons) -->
  <g transform="translate(490,108)">
    <!-- Outer Horizon & Meridian Arcs -->
    <path d="M -138 0 A 138 86 0 0 1 138 0" fill="#EEF3F8" stroke="url(#merSlate)" stroke-width="1.8"/>
    <path d="M -154 4 A 154 96 0 0 1 154 4" fill="none" stroke="url(#merGold)" stroke-width="1.3"/>
    <!-- 8 Realm Longitude Arcs -->
    <path d="M -104 0 A 104 86 0 0 1 104 0" fill="none" stroke="#7F8995" stroke-width="0.9" opacity="0.65"/>
    <path d="M -68 0 A 68 86 0 0 1 68 0" fill="none" stroke="#7F8995" stroke-width="0.9" opacity="0.65"/>
    <path d="M -32 0 A 32 86 0 0 1 32 0" fill="none" stroke="#7F8995" stroke-width="0.9" opacity="0.65"/>
    <line x1="0" y1="-86" x2="0" y2="0" stroke="#506F8A" stroke-width="1.1" opacity="0.8"/>
    <!-- Latitude Parallels -->
    <path d="M -126 -30 Q 0 -46 126 -30" fill="none" stroke="#7F8995" stroke-width="0.85" opacity="0.6"/>
    <path d="M -96 -58 Q 0 -70 96 -58" fill="none" stroke="#7F8995" stroke-width="0.85" opacity="0.6"/>
    <line x1="-142" y1="0" x2="142" y2="0" stroke="#464C55" stroke-width="1.4"/>

    <!-- Twin Moons of Meridion: Radiance (luminous outer pearl) & Echo (dark slate inner) -->
    <circle cx="-46" cy="-46" r="10" fill="#FFFFFF" stroke="#506F8A" stroke-width="1.1"/>
    <circle cx="48" cy="-42" r="6.5" fill="#302F33" stroke="#9EA7B3" stroke-width="1"/>

    <!-- Laurel Sprigs -->
    <g fill="#506F8A" opacity="0.82">
      <path d="M -152 -6 C -166 -22, -162 -40, -146 -44 C -144 -28, -146 -16, -152 -6 Z"/>
      <path d="M -138 -32 C -150 -48, -144 -64, -128 -66 C -128 -52, -132 -40, -138 -32 Z"/>
      <path d="M 152 -6 C 166 -22, 162 -40, 146 -44 C 144 -28, 146 -16, 152 -6 Z"/>
      <path d="M 138 -32 C 150 -48, 144 -64, 128 -66 C 128 -52, 132 -40, 138 -32 Z"/>
    </g>

    <!-- Sovereign 8-Point Meridian Star -->
    <polygon points="0,-106 4,-90 20,-86 4,-82 0,-66 -4,-82 -20,-86 -4,-90" fill="url(#merGold)"/>
  </g>

  <!-- Ear Labels -->
  <text x="200" y="92" text-anchor="middle" font-family="'Crimson Text', Georgia, serif" font-size="14" letter-spacing="5.5" fill="#464C55">EIGHT REALMS</text>
  <line x1="110" y1="102" x2="290" y2="102" stroke="#7F8995" stroke-width="1"/>
  <text x="780" y="92" text-anchor="middle" font-family="'Crimson Text', Georgia, serif" font-size="14" letter-spacing="5.5" fill="#464C55">MERIDION DAILY</text>
  <line x1="690" y1="102" x2="870" y2="102" stroke="#7F8995" stroke-width="1"/>

  <!-- Primary Masthead Title -->
  <text x="490" y="202" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="94" letter-spacing="3.5" fill="#141214">THE MERIDIAN</text>

  <!-- Approved Tagline & Rules -->
  <line x1="96" y1="238" x2="296" y2="238" stroke="url(#merGold)" stroke-width="1.6"/>
  <text x="490" y="243" text-anchor="middle" font-family="'Crimson Text', Georgia, serif" font-style="italic" font-size="18" letter-spacing="6" fill="#464C55">NEWS  ✦  ANALYSIS  ✦  PERSPECTIVE</text>
  <line x1="684" y1="238" x2="884" y2="238" stroke="url(#merGold)" stroke-width="1.6"/>
  <line x1="72" y1="262" x2="908" y2="262" stroke="#464C55" stroke-width="1.2"/>
</svg>
